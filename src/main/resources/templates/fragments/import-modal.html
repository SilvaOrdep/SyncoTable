<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="importModal"
     class="modal fade"
     id="importModal"
     tabindex="-1"
     aria-labelledby="importModalLabel"
     aria-hidden="true"
     th:attr="data-current-user-id=${currentUserId}">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="importModalLabel">Importar Tabela</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="importForm"
                  action="/card/import"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="modal-body">

                    <input type="hidden" id="userId" name="userId" th:value="${userId}"/>

                    <div class="mb-3">
                        <label for="cardTitle" class="form-label">Título do Card</label>
                        <input type="text"
                               class="form-control"
                               id="cardTitle"
                               name="suggestedTitle"
                               placeholder="Digite o título do card">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Arquivo da Tabela</label>

                        <div class="file-upload-area" id="fileUploadArea">

                            <input type="file"
                                   id="fileInput"
                                   name="file"
                                   accept=".xlsx,.xls,.csv"
                                   required>

                            <div id="uploadPlaceholder">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                                     fill="currentColor"
                                     class="bi bi-cloud-upload mb-3 text-muted"
                                     viewBox="0 0 16 16">
                                    <path fill-rule="evenodd"
                                          d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804
                             16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0
                             0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5
                             C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153
                             1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318
                             1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11
                             0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723
                             1.464-2.383z"/>
                                    <path fill-rule="evenodd"
                                          d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5
                             5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5
                             0 1 1-.708-.708l3-3z"/>
                                </svg>

                                <p class="mb-1">Arraste e solte o arquivo aqui</p>
                                <p class="text-muted small">ou <a href="#" id="browseFile">clique para selecionar</a></p>
                                <p class="text-muted small mt-2">Formatos suportados: .xlsx, .xls, .csv</p>
                            </div>

                            <div id="fileInfo" class="d-none">
                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"
                                     fill="currentColor"
                                     class="bi bi-file-earmark-spreadsheet text-success mb-3"
                                     viewBox="0 0 16 16">
                                    <path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0
                             0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0
                             11 4.5h2V9H3V2a1 1 0 0 1 1-1h5.5v2zM3 12v-2h2v2H3zm0
                             1h2v2H4a1 1 0 0 1-1-1v-1zm3 2v-2h3v2H6zm4 0v-2h3v1a1
                             1 0 0 1-1 1h-2zm3-3h-3v-2h3v2zm-7 0v-2h3v2H6z"/>
                                </svg>

                                <p class="mb-1" id="fileName"></p>
                                <p class="text-muted small" id="fileSize"></p>
                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        id="removeFile">Remover arquivo</button>
                            </div>

                        </div>
                    </div>

                    <div class="alert alert-info small" role="alert">
                        <strong>Dica:</strong> A primeira linha do arquivo será usada como cabeçalho das colunas.
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                    <button type="submit" class="btn btn-primary" id="btnSubmitImport" disabled>
                        <span id="importButtonText">Importare</span>
                        <span id="importSpinner" class="spinner-border spinner-border-sm d-none"
                              role="status" aria-hidden="true"></span>
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
</html>
