<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .sortable {
        cursor: pointer;
        user-select: none;
        position: relative;
        padding-right: 20px;
      }

      .sortable:hover {
        background-color: rgba(28, 28, 28, 0.6);
      }

      .sort-icon {
        position: absolute;
        right: 5px;
        opacity: 0.5;
        font-size: 0.8em;
      }

      .sort-icon.active {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header th:insert="~{fragments/header :: header}"></header>

    <main class="container my-4">
      <div
        class="container d-flex justify-content-between mb-3 align-items-center"
      >
        <h3 id="cardTitleHeading" th:text="${card.title()}">Card</h3>
        <div class="d-flex gap-2">
          <button class="btn btn-light" id="btnAddRow">+ Linha</button>
          <select id="selectPerPage" class="form-select form-select-sm">
            <option value="5">5 / página</option>
            <option value="10" selected>10 / página</option>
            <option value="25">25 / página</option>
          </select>
          <input
            type="file"
            id="fileInputXLSX"
            accept=".xlsx,.xls"
            style="display: none"
          />
          <button class="btn btn-danger" id="btnDeleteSelected" disabled>
            Deletar selecionados
          </button>
          <button class="btn btn-primary" id="btnExportCSV">Exportar</button>
        </div>
      </div>

      <div class="table-responsive glass p-3">
        <table
          class="table table-hover table-bordered align-middle text-white"
          id="dataTable"
        >
          <thead class="table-dark">
            <tr>
              <th style="width: 40px">
                <input
                  type="checkbox"
                  id="checkboxSelectAll"
                  class="form-check-input"
                />
              </th>
              <th
                th:each="col : ${columns}"
                class="sortable"
                th:data-column-key="${col.key()}"
                th:classappend="${sortBy == col.key()} ? 'table-active' : ''"
              >
                <span th:text="${col.label()}"></span>
                <span
                  class="sort-icon"
                  th:classappend="${sortBy == col.key()} ? 'active' : ''"
                >
                  <span th:if="${sortBy == col.key() && sortDirection == 'ASC'}"
                    >▲</span
                  >
                  <span
                    th:if="${sortBy == col.key() && sortDirection == 'DESC'}"
                    >▼</span
                  >
                  <span th:if="${sortBy != col.key() || sortBy == null}"
                    >⇅</span
                  >
                </span>
              </th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr
              th:each="row : ${rows}"
              th:data-row-id="${row.id()}"
              th:data-row-version="${row.version()}"
            >
              <td>
                <input
                  type="checkbox"
                  class="form-check-input checkbox-row"
                  th:value="${row.id()}"
                />
              </td>
              <td
                th:each="col : ${columns}"
                th:text="${row.values()[col.key()]}"
              >
                valor
              </td>
              <td>
                <div class="btn-group btn-group-sm">
                  <button class="btn btn-primary btn-edit">Editar</button>
                  <form
                    th:action="@{/card/{id}/row/{rowId}(id=${card.id()}, rowId=${row.id()})}"
                    th:method="delete"
                  >
                    <button type="submit" class="btn btn-danger btn-delete">
                      Deletar
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(rows)}">
              <td
                th:colspan="${#lists.size(columns)+2}"
                class="text-center text-muted"
              >
                Nenhum registro encontrado.
              </td>
            </tr>
          </tbody>
        </table>
        <nav>
          <ul class="pagination" id="pagination"></ul>
        </nav>
      </div>
      <div
        th:data-card-id="${card.id()}"
        th:data-sort-by="${sortBy}"
        th:data-sort-direction="${sortDirection}"
        th:data-user-id="${userId}"
        style="display: none"
      ></div>
    </main>

    <div class="modal fade" id="rowModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Nova Linha</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="rowForm">
              <div id="formFields"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-primary" id="btnSaveRow">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const columnsData = /*[[${columns}]]*/ [];
      const columns = columnsData.map((col) => ({
        id: col.id,
        key: col.key,
        label: col.label,
        type: col.type,
      }));
      /*]]>*/
    </script>

    <script>
      const cardId = document
        .querySelector("[data-card-id]")
        .getAttribute("data-card-id");
      const userId = document
        .querySelector("[data-card-id]")
        .getAttribute("data-user-id");
      const currentSortBy = document
        .querySelector("[data-card-id]")
        .getAttribute("data-sort-by");
      const currentSortDirection =
        document
          .querySelector("[data-card-id]")
          .getAttribute("data-sort-direction") || "ASC";

      let paginationState = {
        currentPage: 1,
        perPage: 10,
        totalRows: 0,
      };

      // Column permissions cache
      let cardPermission = null;
      const columnPerms = new Map(); // columnId -> { canView, canEdit }

      const checkboxes = document.querySelectorAll(".checkbox-row");
      const selectAllCheckbox = document.getElementById("checkboxSelectAll");
      const btnDeleteSelected = document.getElementById("btnDeleteSelected");
      const selectPerPage = document.getElementById("selectPerPage");
      const paginationContainer = document.getElementById("pagination");

      function initPagination() {
        const totalRows = document.querySelectorAll(
          "tbody tr:not(:has(td:only-child))"
        ).length;
        paginationState.totalRows = totalRows;
        paginationState.currentPage = 1;
        renderPagination();
      }

      function renderPagination() {
        paginationContainer.innerHTML = "";
        const totalPages = Math.ceil(
          paginationState.totalRows / paginationState.perPage
        );

        if (totalPages <= 1) return;

        const prevLi = document.createElement("li");
        prevLi.className = `page-item ${
          paginationState.currentPage === 1 ? "disabled" : ""
        }`;
        prevLi.innerHTML = `<a class="page-link" href="#" ${
          paginationState.currentPage === 1
            ? "tabindex='-1' aria-disabled='true'"
            : ""
        }>Anterior</a>`;
        prevLi.addEventListener("click", (e) => {
          e.preventDefault();
          if (paginationState.currentPage > 1) {
            paginationState.currentPage--;
            updateTableDisplay();
            renderPagination();
          }
        });
        paginationContainer.appendChild(prevLi);

        for (let i = 1; i <= totalPages; i++) {
          const li = document.createElement("li");
          li.className = `page-item ${
            i === paginationState.currentPage ? "active" : ""
          }`;
          li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
          li.addEventListener("click", (e) => {
            e.preventDefault();
            paginationState.currentPage = i;
            updateTableDisplay();
            renderPagination();
          });
          paginationContainer.appendChild(li);
        }

        const nextLi = document.createElement("li");
        nextLi.className = `page-item ${
          paginationState.currentPage === totalPages ? "disabled" : ""
        }`;
        nextLi.innerHTML = `<a class="page-link" href="#" ${
          paginationState.currentPage === totalPages
            ? "tabindex='-1' aria-disabled='true'"
            : ""
        }>Próximo</a>`;
        nextLi.addEventListener("click", (e) => {
          e.preventDefault();
          if (paginationState.currentPage < totalPages) {
            paginationState.currentPage++;
            updateTableDisplay();
            renderPagination();
          }
        });
        paginationContainer.appendChild(nextLi);
      }

      function updateTableDisplay() {
        const rows = Array.from(
          document.querySelectorAll("tbody tr:not(:has(td:only-child))")
        );
        const start =
          (paginationState.currentPage - 1) * paginationState.perPage;
        const end = start + paginationState.perPage;

        rows.forEach((row, idx) => {
          row.style.display = idx >= start && idx < end ? "" : "none";
        });

        selectAllCheckbox.checked = false;
        document.querySelectorAll(".checkbox-row").forEach((cb) => {
          cb.checked = false;
        });
        updateDeleteButton();
      }

      selectPerPage.addEventListener("change", (e) => {
        paginationState.perPage = parseInt(e.target.value, 10);
        paginationState.currentPage = 1;
        updateTableDisplay();
        renderPagination();
      });

      document.querySelectorAll(".sortable").forEach((header) => {
        header.addEventListener("click", function () {
          const columnKey = this.getAttribute("data-column-key");
          let newDirection = "ASC";

          if (currentSortBy === columnKey) {
            newDirection = currentSortDirection === "ASC" ? "DESC" : "ASC";
          }

          window.location.href = `/card/${cardId}?sortBy=${columnKey}&sortDirection=${newDirection}`;
        });
      });

      selectAllCheckbox.addEventListener("change", (e) => {
        const start =
          (paginationState.currentPage - 1) * paginationState.perPage;
        const end = start + paginationState.perPage;
        const rows = Array.from(
          document.querySelectorAll("tbody tr:not(:has(td:only-child))")
        );

        rows.forEach((row, idx) => {
          if (idx >= start && idx < end) {
            row.querySelector(".checkbox-row").checked = e.target.checked;
          }
        });
        updateDeleteButton();
      });

      document.querySelectorAll(".checkbox-row").forEach((cb) => {
        cb.addEventListener("change", updateDeleteButton);
      });

      function updateDeleteButton() {
        const checkedCount = document.querySelectorAll(
          ".checkbox-row:checked"
        ).length;
        btnDeleteSelected.disabled = checkedCount === 0;
      }

      btnDeleteSelected.addEventListener("click", () => {
        const selectedIds = Array.from(
          document.querySelectorAll(".checkbox-row:checked")
        ).map((cb) => cb.value);

        if (selectedIds.length === 0) {
          alert("Selecione ao menos uma linha");
          return;
        }

        if (!confirm(`Deseja deletar ${selectedIds.length} linha(s)?`)) {
          return;
        }

        fetch(`/card/${cardId}/row/batch-delete`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ rowIds: selectedIds }),
        })
          .then((response) => {
            if (response.ok) {
              location.reload();
            } else {
              alert("Erro ao deletar linhas");
            }
          })
          .catch((error) => {
            console.error("Erro:", error);
            alert("Erro ao deletar linhas");
          });
      });

      const rowModal = new bootstrap.Modal(document.getElementById("rowModal"));
      let currentRowData = null;

      document.getElementById("btnAddRow").addEventListener("click", () => {
        document.getElementById("modalTitle").textContent = "Nova Linha";
        document.getElementById("rowForm").reset();
        currentRowData = null;
        renderFormFields();
        rowModal.show();
      });

      document.querySelectorAll(".btn-edit").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const row = e.target.closest("tr");
          const rowId = row.getAttribute("data-row-id");
          const rowVersion = row.getAttribute("data-row-version");
          const values = {};

          row.querySelectorAll("td").forEach((td, idx) => {
            if (idx > 0 && idx <= columns.length) {
              values[columns[idx - 1].key] = td.textContent.trim();
            }
          });

          currentRowData = {
            id: rowId,
            values: values,
            version: parseInt(rowVersion),
          };

          document.getElementById("modalTitle").textContent = "Editar Linha";
          renderFormFields(values);
          rowModal.show();
        });
      });

      function applyColumnPermissions() {
        if (!cardPermission) return;

        // Map overrides
        columnPerms.clear();
        (cardPermission.columnOverrides || []).forEach((ov) => {
          columnPerms.set(ov.columnId, {
            canView: !!ov.canView,
            canEdit: !!ov.canEdit,
          });
        });

        // Hide non-viewable columns in table header and rows
        columns.forEach((col, idx) => {
          const ov = columnPerms.get(col.id);
          const canView = !ov || ov.canView;

          const headerEl = document.querySelector(
            `th.sortable[data-column-key="${col.key}"]`
          );
          if (headerEl) headerEl.style.display = canView ? "" : "none";

          // rows: first column is checkbox, so data cells start at index 1
          document.querySelectorAll("tbody tr").forEach((tr) => {
            const cells = tr.querySelectorAll("td");
            if (cells.length > 1 + idx) {
              cells[1 + idx].style.display = canView ? "" : "none";
            }
          });
        });

        // Disable actions based on card-level
        const canCreate = !!cardPermission.canCreate;
        const canDelete = !!cardPermission.canDelete;
        const canEditCard = !!cardPermission.canEdit;

        document
          .getElementById("btnAddRow")
          ?.toggleAttribute("disabled", !canCreate);
        document
          .getElementById("btnDeleteSelected")
          ?.toggleAttribute("disabled", !canDelete);

        // disable edit buttons if global edit is false
        if (!canEditCard) {
          document
            .querySelectorAll(".btn-edit")
            .forEach((b) => b.toggleAttribute("disabled", true));
        }
      }

      // Adjust form rendering to respect per-column permissions
      function renderFormFields(values = {}) {
        const formFields = document.getElementById("formFields");
        formFields.innerHTML = "";

        columns.forEach((col) => {
          const ov = columnPerms.get(col.id);
          const canView = !ov || ov.canView;
          const canEdit = !ov || ov.canEdit;

          if (!canView) return;

          const value = values[col.key] || "";
          let input;
          const disabledAttr = canEdit ? "" : "disabled";

          switch (col.type) {
            case "TEXT":
              input = `<input type="text" class="form-control" data-key="${col.key}" value="${value}" ${disabledAttr}>`;
              break;
            case "NUMBER":
              input = `<input type="number" class="form-control" data-key="${col.key}" value="${value}" ${disabledAttr}>`;
              break;
            case "DATE":
              input = `<input type="date" class="form-control" data-key="${col.key}" value="${value}" ${disabledAttr}>`;
              break;
            default:
              input = `<input type="text" class="form-control" data-key="${col.key}" value="${value}" ${disabledAttr}>`;
          }

          formFields.innerHTML += `
            <div class="mb-3">
              <label class="form-label">${col.label}</label>
              ${input}
            </div>
          `;
        });
      }

      // Fetch current user's permission matrix for this card
      document.addEventListener("DOMContentLoaded", () => {
        fetch(`/card/${cardId}/permissions`)
          .then((r) => (r.ok ? r.json() : Promise.reject()))
          .then((perm) => {
            cardPermission = perm || null;
            applyColumnPermissions();
            initPagination(); // after hiding columns, re-init pagination
          })
          .catch(() => {
            initPagination();
          });
      });

      document.getElementById("btnSaveRow").addEventListener("click", () => {
        const values = {};
        document.querySelectorAll("#rowForm input").forEach((input) => {
          values[input.getAttribute("data-key")] = input.value;
        });

        if (currentRowData) {
          fetch(`/card/${cardId}/row/update`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              rowId: currentRowData.id,
              version: currentRowData.version,
              values: values,
            }),
          })
            .then((r) => {
              if (r.ok) {
                location.reload();
              } else {
                alert("Erro ao atualizar");
              }
            })
            .catch((err) => {
              console.error("Fetch error:", err);
              alert("Erro ao atualizar");
            });
        } else {
          fetch(`/card/${cardId}/row`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              cardId: parseInt(cardId),
              userId: parseInt(userId),
              values: values,
            }),
          })
            .then((r) => {
              if (r.ok) {
                location.reload();
              } else {
                alert("Erro ao criar");
              }
            })
            .catch((err) => {
              console.error("Fetch error:", err);
              alert("Erro ao criar");
            });
        }

        rowModal.hide();
      });

      document.getElementById("rowForm").addEventListener("input", (e) => {
        if (e.target.classList.contains("form-control")) {
          const key = e.target.getAttribute("data-key");
          const col = columns.find((c) => c.key === key);

          if (col) {
            validateFieldType(e.target, col.type);
          }
        }
      });

      function validateFieldType(input, type) {
        const value = input.value.trim();
        if (!value) return;

        const isValid = {
          NUMBER: !isNaN(value) && value !== "",
          DATE: !isNaN(Date.parse(value)),
          TEXT: true,
        }[type];

        input.classList.toggle("is-invalid", !isValid);
      }

      document.addEventListener("DOMContentLoaded", initPagination);
    </script>
  </body>
</html>
