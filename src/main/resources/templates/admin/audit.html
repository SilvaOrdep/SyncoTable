<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  lang="pt-BR"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logs do Sistema</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .glass {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .sortable {
        cursor: pointer;
        user-select: none;
        position: relative;
      }

      .sortable:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .sort-icon {
        margin-left: 5px;
        opacity: 0.3;
      }

      .sort-icon.active {
        opacity: 1;
      }

      .search-container {
        max-width: 400px;
      }

      .badge-action {
        font-size: 0.85rem;
        padding: 0.35em 0.65em;
      }
    </style>
  </head>
  <body>
    <header th:insert="~{fragments/header :: header}"></header>

    <main class="container my-4" sec:authorize="hasRole('ADMIN')">
      <div class="d-flex justify-content-between mb-3 align-items-center">
        <h3>Logs do Sistema</h3>
        <a href="/admin/users" class="btn btn-outline-secondary">
          Voltar para Usuários
        </a>
      </div>

      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="searchInput" class="form-label">Buscar</label>
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Buscar por usuário ou ação..."
              />
            </div>
            <div class="col-md-3">
              <label for="filterAction" class="form-label">Filtrar por Ação</label>
              <select class="form-select" id="filterAction">
                <option value="">Todas as ações</option>
                <option value="CREATE">CREATE</option>
                <option value="UPDATE">UPDATE</option>
                <option value="DELETE">DELETE</option>
                <option value="READ">READ</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="selectPerPage" class="form-label">Registros por página</label>
              <select id="selectPerPage" class="form-select">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-secondary w-100" id="btnClearFilters">
                Limpar Filtros
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="table-responsive glass p-3">
        <table class="table table-hover table-bordered align-middle text-white">
          <thead class="table-dark">
            <tr>
              <th class="sortable" data-column="id" style="width: 80px">
                ID <span class="sort-icon">⇅</span>
              </th>
              <th class="sortable" data-column="userName" style="width: 150px">
                Usuário <span class="sort-icon">⇅</span>
              </th>
              <th class="sortable" data-column="entityType" style="width: 150px">
                Tipo de Entidade <span class="sort-icon">⇅</span>
              </th>
              <th class="sortable" data-column="action" style="width: 120px">
                Ação <span class="sort-icon">⇅</span>
              </th>
              <th class="sortable" data-column="timestamp">
                Data/Hora <span class="sort-icon">⇅</span>
              </th>
              <th style="width: 100px">Detalhes</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr
              th:each="log : ${logs}"
              th:data-log-id="${log.id()}"
              th:data-user-name="${log.userName()}"
              th:data-action="${log.action()}"
              th:data-timestamp="${log.timestamp()}"
              th:data-entity-type="${log.entityType()}"
            >
              <td th:text="${log.id()}">1</td>
              <td>
                <span th:text="${log.userName() != null ? log.userName() : 'Sistema'}">
                  Nome do Usuário
                </span>
              </td>
              <td>
                <span class="badge bg-info" th:text="${log.entityType()}">
                  Entity Type
                </span>
              </td>
              <td>
                <span
                  class="badge badge-action"
                  th:classappend="${log.action() == 'CREATE' ? 'bg-success' : (log.action() == 'UPDATE' ? 'bg-warning' : (log.action() == 'DELETE' ? 'bg-danger' : 'bg-secondary'))}"
                  th:text="${log.action()}"
                >
                  Action
                </span>
              </td>
              <td th:text="${#temporals.format(log.timestamp(), 'dd/MM/yyyy HH:mm:ss')}">
                Date/Time
              </td>
              <td>
                <button
                  class="btn btn-sm btn-outline-light btn-view-details"
                  th:data-entity-id="${log.entityId()}"
                  th:data-entity-type="${log.entityType()}"
                >
                  Ver
                </button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
              <td colspan="6" class="text-center text-muted">
                Nenhum log encontrado.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <nav aria-label="Paginação de logs">
        <ul class="pagination justify-content-center mt-3" id="pagination"></ul>
      </nav>
    </main>

    <div class="modal fade" id="detailsModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Detalhes do Log</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <dl class="row">
              <dt class="col-sm-3">ID do Log:</dt>
              <dd class="col-sm-9" id="detailLogId">-</dd>

              <dt class="col-sm-3">Usuário:</dt>
              <dd class="col-sm-9" id="detailUserName">-</dd>

              <dt class="col-sm-3">Tipo de Entidade:</dt>
              <dd class="col-sm-9" id="detailEntityType">-</dd>


              <dt class="col-sm-3">Ação:</dt>
              <dd class="col-sm-9" id="detailAction">-</dd>

              <dt class="col-sm-3">Data/Hora:</dt>
              <dd class="col-sm-9" id="detailTimestamp">-</dd>
            </dl>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script th:inline="javascript">
      /*<![CDATA[*/
      const logsData = /*[[${logs}]]*/ [];
      /*]]>*/
    </script>

    <script>
      // State management
      let state = {
        allLogs: [],
        filteredLogs: [],
        currentPage: 1,
        perPage: 10,
        sortColumn: 'timestamp',
        sortDirection: 'desc',
        searchTerm: '',
        filterAction: ''
      };

      const detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));

      // Initialize
      document.addEventListener('DOMContentLoaded', () => {
        initializeLogs();
        setupEventListeners();
        applyFiltersAndSort();
      });

      function initializeLogs() {
        state.allLogs = logsData.map(log => ({
          id: log.id,
          userName: log.userName || 'Sistema',
          entityType: log.entityType || '-',
          entityId: log.entityId || '-',
          action: log.action || '-',
          timestamp: log.timestamp
        }));
        state.filteredLogs = [...state.allLogs];
      }

      function setupEventListeners() {
        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
          state.searchTerm = e.target.value.toLowerCase();
          state.currentPage = 1;
          applyFiltersAndSort();
        });

        // Filter action
        document.getElementById('filterAction').addEventListener('change', (e) => {
          state.filterAction = e.target.value;
          state.currentPage = 1;
          applyFiltersAndSort();
        });

        // Per page selector
        document.getElementById('selectPerPage').addEventListener('change', (e) => {
          state.perPage = parseInt(e.target.value);
          state.currentPage = 1;
          applyFiltersAndSort();
        });

        // Clear filters
        document.getElementById('btnClearFilters').addEventListener('click', () => {
          document.getElementById('searchInput').value = '';
          document.getElementById('filterAction').value = '';
          state.searchTerm = '';
          state.filterAction = '';
          state.currentPage = 1;
          applyFiltersAndSort();
        });

        // Sortable headers
        document.querySelectorAll('.sortable').forEach(header => {
          header.addEventListener('click', () => {
            const column = header.getAttribute('data-column');
            if (state.sortColumn === column) {
              state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
              state.sortColumn = column;
              state.sortDirection = 'asc';
            }
            updateSortIcons();
            applyFiltersAndSort();
          });
        });

        // View details buttons
        document.addEventListener('click', (e) => {
          if (e.target.classList.contains('btn-view-details')) {
            const row = e.target.closest('tr');
            showDetails(row);
          }
        });
      }

      function applyFiltersAndSort() {
        // Filter
        state.filteredLogs = state.allLogs.filter(log => {
          const matchesSearch = 
            log.userName.toString().toLowerCase().includes(state.searchTerm) ||
            log.action.toLowerCase().includes(state.searchTerm) ||
            log.entityType.toLowerCase().includes(state.searchTerm);
          
          const matchesAction = !state.filterAction || log.action === state.filterAction;

          return matchesSearch && matchesAction;
        });

        // Sort
        state.filteredLogs.sort((a, b) => {
          let aVal = a[state.sortColumn];
          let bVal = b[state.sortColumn];

          // Handle timestamp specially
          if (state.sortColumn === 'timestamp') {
            aVal = new Date(aVal).getTime();
            bVal = new Date(bVal).getTime();
          }

          if (aVal < bVal) return state.sortDirection === 'asc' ? -1 : 1;
          if (aVal > bVal) return state.sortDirection === 'asc' ? 1 : -1;
          return 0;
        });

        renderTable();
        renderPagination();
      }

      function renderTable() {
        const tbody = document.getElementById('logsTableBody');
        const start = (state.currentPage - 1) * state.perPage;
        const end = start + state.perPage;
        const pageData = state.filteredLogs.slice(start, end);

        if (pageData.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center text-muted">
                Nenhum log encontrado com os filtros aplicados.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = pageData.map(log => {
          const actionBadgeClass = 
            log.action === 'CREATE' ? 'bg-success' :
            log.action === 'UPDATE' ? 'bg-warning' :
            log.action === 'DELETE' ? 'bg-danger' : 'bg-secondary';

          const formattedDate = new Date(log.timestamp).toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });

          return `
            <tr data-log-id="${log.id}" data-user-name="${log.userName}" 
                data-action="${log.action}" data-timestamp="${log.timestamp}"
                data-entity-type="${log.entityType}" data-entity-id="${log.entityId}">
              <td>${log.id}</td>
              <td>${log.userName}</td>
              <td><span class="badge bg-info">${log.entityType}</span></td>
              <td><span class="badge badge-action ${actionBadgeClass}">${log.action}</span></td>
              <td>${formattedDate}</td>
              <td>
                <button class="btn btn-sm btn-outline-light btn-view-details">
                  Ver
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }

      function renderPagination() {
        const totalPages = Math.ceil(state.filteredLogs.length / state.perPage);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
          pagination.innerHTML = '';
          return;
        }

        let html = '';

        // Previous button
        html += `
          <li class="page-item ${state.currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${state.currentPage - 1}">Anterior</a>
          </li>
        `;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          if (
            i === 1 ||
            i === totalPages ||
            (i >= state.currentPage - 2 && i <= state.currentPage + 2)
          ) {
            html += `
              <li class="page-item ${i === state.currentPage ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${i}">${i}</a>
              </li>
            `;
          } else if (i === state.currentPage - 3 || i === state.currentPage + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
          }
        }

        // Next button
        html += `
          <li class="page-item ${state.currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${state.currentPage + 1}">Próximo</a>
          </li>
        `;

        pagination.innerHTML = html;

        // Add click handlers
        pagination.querySelectorAll('a.page-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = parseInt(link.getAttribute('data-page'));
            if (page >= 1 && page <= totalPages) {
              state.currentPage = page;
              renderTable();
              renderPagination();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          });
        });
      }

      function updateSortIcons() {
        document.querySelectorAll('.sortable').forEach(header => {
          const icon = header.querySelector('.sort-icon');
          const column = header.getAttribute('data-column');
          
          icon.classList.remove('active');
          
          if (column === state.sortColumn) {
            icon.classList.add('active');
            icon.textContent = state.sortDirection === 'asc' ? '▲' : '▼';
          } else {
            icon.textContent = '⇅';
          }
        });
      }

      function showDetails(row) {
        const logId = row.getAttribute('data-log-id');
        const userName = row.getAttribute('data-user-name');
        const entityType = row.getAttribute('data-entity-type');
        const entityId = row.getAttribute('data-entity-id');
        const action = row.getAttribute('data-action');
        const timestamp = row.getAttribute('data-timestamp');

        document.getElementById('detailLogId').textContent = logId;
        document.getElementById('detailUserName').textContent = userName;
        document.getElementById('detailEntityType').textContent = entityType;
        document.getElementById('detailAction').textContent = action;
        document.getElementById('detailTimestamp').textContent = new Date(timestamp).toLocaleString('pt-BR');

        detailsModal.show();
      }

      updateSortIcons();
    </script>
  </body>
</html>
